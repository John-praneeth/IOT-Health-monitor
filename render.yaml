## render.yaml — IoT Healthcare Patient Monitor
## Deploys: PostgreSQL DB + FastAPI backend web service + React static frontend

databases:
  - name: iot-healthcare-db
    databaseName: patient_monitor
    user: iot_user
    plan: free
    region: oregon

services:
  - type: web
    name: iot-healthcare-backend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: feature/multimodal-ai-engine
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ── Database (auto-linked from above DB) ──────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: iot-healthcare-db
          property: connectionString

      # ── JWT / Auth ────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: ADMIN_USERNAME
        value: admin

      # ── App Runtime ───────────────────────────────────────────────────────────
      - key: DATA_SOURCE
        value: fake

      - key: ENVIRONMENT
        value: production

      - key: SEED_DB_ON_STARTUP
        value: "true"

      - key: PORT
        value: "8000"

      # ── CORS — allow the Render frontend origin ───────────────────────────────
      - key: CORS_ORIGINS
        value: https://iot-healthcare-frontend.onrender.com,http://localhost:3000

      # ── Redis (optional — disabled on free tier) ──────────────────────────────
      - key: REDIS_REQUIRED
        value: "false"

      # ── WhatsApp (disabled by default) ────────────────────────────────────────
      - key: WHATSAPP_ENABLED
        value: "false"

      # ── Logging ───────────────────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: INFO

      - key: SERVICE_NAME
        value: iot-healthcare

      # ── Limits ────────────────────────────────────────────────────────────────
      - key: MAX_ALERTS_PER_MINUTE
        value: "20"

      - key: VITALS_RETENTION_DAYS
        value: "30"

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      - key: WS_CONNECTION_LIMIT
        value: "50"

      - key: COOKIE_SECURE
        value: "true"

  # ── Frontend (React static site) ──────────────────────────────────────────
  # CRA bakes REACT_APP_* into the bundle at build time. Without these the app
  # falls back to same-origin '/api', which a static site cannot serve.
  - type: web
    name: iot-healthcare-frontend
    runtime: static
    branch: feature/multimodal-ai-engine
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: build
    autoDeploy: true

    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://iot-healthcare-backend.onrender.com
      - key: REACT_APP_WS_BASE_URL
        value: wss://iot-healthcare-backend.onrender.com/ws

    # SPA fallback — react-router paths (/patients, /alerts, …) must serve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
